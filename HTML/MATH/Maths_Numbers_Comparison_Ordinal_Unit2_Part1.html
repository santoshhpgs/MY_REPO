<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard 1 Maths Challenge</title>
<style>
:root{--g:#35b96b;--gd:#21884c;--ink:#26343c;--line:#dbe8e1}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(135deg,#effaf4,#f7fbff)}
header{background:linear-gradient(135deg,#238f55,#57c97d);color:#fff;text-align:center;padding:28px 15px;box-shadow:0 5px 18px #0002}header h1{margin:0;font-size:clamp(24px,4vw,36px)}header p{margin:8px 0 0}
.wrap{max-width:1050px;margin:auto;padding:16px 14px 50px}.progress-card{position:sticky;top:0;z-index:10;background:#ffffffee;padding:12px 0 14px;backdrop-filter:blur(8px)}.progress-top{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.progress{height:13px;background:#e3eee8;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#35b96b,#8bdd78);transition:.25s}
.q{background:#fff;border:1px solid var(--line);border-radius:18px;margin:16px 0;padding:18px;box-shadow:0 5px 18px #2d6b4810}.qhead{display:flex;gap:12px;align-items:flex-start}.num{min-width:38px;height:38px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900}.cat{font-size:11px;font-weight:800;color:var(--gd);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}.question{font-size:18px;font-weight:800;line-height:1.4}.visual{margin:14px 0;padding:14px;border:1px dashed #c9dcd3;border-radius:14px;background:#fbfffd;text-align:center;font-size:24px;line-height:1.7}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.option{position:relative;display:flex;align-items:center;gap:10px;padding:13px;border:2px solid #dce7ec;border-radius:13px;background:#fff;cursor:pointer;min-height:52px}.option input{position:absolute;opacity:0}.letter{width:30px;height:30px;border-radius:50%;background:#eef5f8;display:grid;place-items:center;font-weight:900;flex:none}.option.selected{border-color:var(--g);background:#effbf3}.option.selected .letter{background:var(--g);color:#fff}
.submit{display:block;width:min(430px,100%);margin:28px auto 10px;border:0;border-radius:15px;padding:16px;font-size:17px;font-weight:900;background:linear-gradient(135deg,#2cab62,#49c879);color:#fff;cursor:pointer;box-shadow:0 7px 15px #2cab6240}.result{display:none;background:#fff;border-radius:20px;padding:24px;margin-top:22px;box-shadow:0 8px 25px #0001;border:1px solid var(--line)}.score{font-size:38px;font-weight:900;color:var(--gd);text-align:center}.percent{text-align:center;font-size:20px;font-weight:800}.message{text-align:center;margin:10px auto 22px;font-size:17px}.review{border-top:1px solid var(--line);padding-top:12px}.review-item{padding:12px;border-radius:12px;margin:8px 0;background:#f7faf9}.correct{border-left:5px solid #32b96a}.wrong{border-left:5px solid #f35a5a}.unanswered{border-left:5px solid #f2b84b}.review b{display:block;margin-bottom:4px}.try{display:block;margin:20px auto 0;border:2px solid var(--g);color:var(--gd);background:#fff;border-radius:13px;padding:12px 24px;font-weight:900;cursor:pointer}
@media(max-width:700px){.options{grid-template-columns:1fr}.q{padding:14px}.question{font-size:16px}}
</style></head>
<body>
<header><h1>🌟 Standard 1 Maths Challenge 🌟</h1><p>Numbers • Counting • Comparison • Ordering • Ordinal Numbers</p></header>
<div class="wrap"><div class="progress-card"><div class="progress-top"><span>Quiz Progress</span><span id="progressText">0 of 40 answered</span></div><div class="progress"><div class="bar" id="bar"></div></div></div><main id="quiz"></main><button class="submit" id="submit">✅ Submit Answers</button><section class="result" id="result"></section></div>
<script>
const questions=[{"cat": "Number Names", "q": "Which numeral is the number name “Twenty-one”?", "opts": ["12", "21", "31", "20"], "a": 1}, {"cat": "Number Names", "q": "Which number name matches 43?", "opts": ["Thirty-four", "Forty-three", "Forty-two", "Thirty-three"], "a": 1}, {"cat": "Number Names", "q": "Which numeral is “Fifty-seven”?", "opts": ["75", "57", "47", "67"], "a": 1}, {"cat": "Number Names", "q": "Which number name matches 19?", "opts": ["Ninety", "Nineteen", "Nine", "Twenty-nine"], "a": 1}, {"cat": "Tens & Ones", "q": "How many tens and ones are in 24?", "opts": ["2 tens and 4 ones", "4 tens and 2 ones", "2 tens and 2 ones", "4 tens and 4 ones"], "a": 0}, {"cat": "Tens & Ones", "q": "Which number has 6 tens and 3 ones?", "opts": ["36", "63", "60", "33"], "a": 1}, {"cat": "Tens & Ones", "q": "What is the numeral for 7 tens and 5 ones?", "opts": ["57", "75", "70", "25"], "a": 1}, {"cat": "Tens & Ones", "q": "How many ones are in 81?", "opts": ["8", "1", "9", "0"], "a": 1}, {"cat": "Counting", "q": "What number comes next? 31, 32, 33, ___", "opts": ["34", "35", "30", "43"], "a": 0}, {"cat": "Counting", "q": "What number comes next? 46, 47, 48, ___", "opts": ["49", "50", "45", "58"], "a": 0}, {"cat": "Counting", "q": "Fill the missing number: 62, 61, 60, ___", "opts": ["59", "58", "63", "69"], "a": 0}, {"cat": "Counting", "q": "Fill the missing number: 55, 54, ___, 52", "opts": ["50", "53", "51", "56"], "a": 1}, {"cat": "Number Line", "q": "On a number line, moving from 14 to 15 is called what?", "opts": ["Backward counting", "Forward counting", "Descending order", "Ordinal counting"], "a": 1}, {"cat": "Number Line", "q": "On a number line, moving from 20 to 19 is called what?", "opts": ["Forward counting", "Backward counting", "Ascending order", "Greater counting"], "a": 1}, {"cat": "Number Line", "q": "Which number comes just after 39?", "opts": ["38", "40", "41", "29"], "a": 1}, {"cat": "Number Line", "q": "Which number comes just before 70?", "opts": ["69", "71", "60", "79"], "a": 0}, {"cat": "Comparison", "q": "Which number is greater?", "opts": ["27", "72", "22", "17"], "a": 1}, {"cat": "Comparison", "q": "Which number is smaller?", "opts": ["45", "54", "35", "50"], "a": 2}, {"cat": "Comparison", "q": "Choose the correct sign: 38 ___ 52", "opts": [">", "<", "=", "+"], "a": 1}, {"cat": "Comparison", "q": "Choose the correct sign: 76 ___ 67", "opts": ["<", ">", "=", "-"], "a": 1}, {"cat": "Comparison", "q": "Choose the correct sign: 44 ___ 44", "opts": ["<", ">", "=", "+"], "a": 2}, {"cat": "Comparison", "q": "Which number is the greatest?", "opts": ["39", "93", "69", "79"], "a": 1}, {"cat": "Comparison", "q": "Which number is the smallest?", "opts": ["81", "18", "28", "61"], "a": 1}, {"cat": "Ordering", "q": "Which list is in ascending order?", "opts": ["18, 12, 15", "12, 15, 18", "18, 15, 12", "15, 12, 18"], "a": 1}, {"cat": "Ordering", "q": "Which list is in descending order?", "opts": ["22, 29, 35", "35, 29, 22", "22, 35, 29", "29, 22, 35"], "a": 1}, {"cat": "Ordering", "q": "Arrange from smallest to greatest: 24, 17, 31", "opts": ["31, 24, 17", "17, 24, 31", "24, 31, 17", "17, 31, 24"], "a": 1}, {"cat": "Ordering", "q": "Arrange from greatest to smallest: 42, 68, 55", "opts": ["42, 55, 68", "68, 55, 42", "55, 68, 42", "68, 42, 55"], "a": 1}, {"cat": "Ordinal Numbers", "q": "Which word tells the position of an object in a line?", "opts": ["Cardinal number", "Ordinal number", "Tens", "Ones"], "a": 1}, {"cat": "Ordinal Numbers", "q": "What is the ordinal form of 1?", "opts": ["One", "First", "Second", "Tenth"], "a": 1}, {"cat": "Ordinal Numbers", "q": "What is the ordinal form of 5?", "opts": ["Five", "Fifth", "Fifty", "Fourth"], "a": 1}, {"cat": "Ordinal Numbers", "q": "Which position comes after Sixth?", "opts": ["Fifth", "Seventh", "Eighth", "First"], "a": 1}, {"cat": "Ordinal Numbers", "q": "Which position comes before Tenth?", "opts": ["Ninth", "Eighth", "Eleventh", "First"], "a": 0}, {"cat": "Ordinal Numbers", "q": "What is the ordinal form of 8?", "opts": ["Eighth", "Eight", "Eighty", "Ninth"], "a": 0}, {"cat": "Patterns", "q": "Find the missing number: 10, 20, 30, ___, 50", "opts": ["35", "40", "45", "60"], "a": 1}, {"cat": "Patterns", "q": "Find the missing number: 5, 10, 15, ___, 25", "opts": ["18", "20", "30", "35"], "a": 1}, {"cat": "Patterns", "q": "Find the missing number: 90, 80, ___, 60", "opts": ["75", "70", "65", "50"], "a": 1}, {"cat": "Counting Objects", "q": "There are 8 flowers. 4 more flowers are added. How many flowers are there altogether?", "opts": ["10", "11", "12", "13"], "a": 2}, {"cat": "Counting Objects", "q": "A tray has 3 rows of 4 eggs. How many eggs are there altogether?", "opts": ["7", "10", "12", "14"], "a": 2}, {"cat": "Everyday Counting", "q": "Which number is NOT on the blackboard?", "opts": ["42", "66", "84", "25"], "a": 3}, {"cat": "Tens & Ones", "q": "What number is 4 tens and 9 ones?", "opts": ["49", "94", "40", "59"], "a": 0}],letters=['A','B','C','D'];
function visual(i){const v={0:'🔢 <b>21</b> &nbsp; Twenty-one',4:'🟦🟦 &nbsp; 🟢🟢🟢🟢',5:'🟦🟦🟦🟦🟦🟦 &nbsp; 🟢🟢🟢',8:'31 ➜ 32 ➜ 33 ➜ ❓',9:'46 ➜ 47 ➜ 48 ➜ ❓',10:'62 ➜ 61 ➜ 60 ➜ ❓',11:'55 ➜ 54 ➜ ❓ ➜ 52',12:'14 ➜ <b>15</b> ➜ 16 ➡️',13:'20 ➜ <b>19</b> ➜ 18 ⬅️',23:'12 ➜ 15 ➜ 18',24:'35 ➜ 29 ➜ 22',27:'🥇 First &nbsp; 🥈 Second &nbsp; 🥉 Third',30:'5️⃣ &nbsp; 6️⃣ &nbsp; <b>7️⃣</b> &nbsp; 8️⃣',33:'10 ➜ 20 ➜ 30 ➜ ❓ ➜ 50',34:'5 ➜ 10 ➜ 15 ➜ ❓ ➜ 25',35:'90 ➜ 80 ➜ ❓ ➜ 60',36:'🌸 🌸 🌸 🌸 🌸 🌸 🌸 🌸 + 🌸 🌸 🌸 🌸',37:'🥚 🥚 🥚 🥚<br>🥚 🥚 🥚 🥚<br>🥚 🥚 🥚 🥚',38:'42 &nbsp; 66 &nbsp; 84 &nbsp; 25'};return v[i]?'<div class="visual">'+v[i]+'</div>':''}
function render(){document.getElementById('quiz').innerHTML=questions.map((q,i)=>'<article class="q"><div class="qhead"><div class="num">'+(i+1)+'</div><div><div class="cat">'+q.cat+'</div><div class="question">'+q.q+'</div></div></div>'+visual(i)+'<div class="options">'+q.opts.map((o,j)=>'<label class="option" data-q="'+i+'"><input type="radio" name="q'+i+'" value="'+j+'"><span class="letter">'+letters[j]+'</span><span>'+o+'</span></label>').join('')+'</div></article>').join('');document.querySelectorAll('.option').forEach(el=>el.onclick=()=>{const i=el.dataset.q;document.querySelectorAll('.option[data-q="'+i+'"]').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');updateProgress()})}
function updateProgress(){let n=0;questions.forEach((_,i)=>{if(document.querySelector('input[name="q'+i+'"]:checked'))n++});progressText.textContent=n+' of 40 answered';bar.style.width=n/40*100+'%'}
submit.onclick=()=>{let score=0,html='';questions.forEach((q,i)=>{const c=document.querySelector('input[name="q'+i+'"]:checked'),ca=q.opts[q.a];if(c&&+c.value===q.a){score++;html+='<div class="review-item correct"><b>Q'+(i+1)+'. '+q.q+'</b>✅ Correct — '+ca+'</div>'}else if(c){html+='<div class="review-item wrong"><b>Q'+(i+1)+'. '+q.q+'</b>❌ Your answer: '+q.opts[+c.value]+'<br>✅ Correct answer: '+ca+'</div>'}else html+='<div class="review-item unanswered"><b>Q'+(i+1)+'. '+q.q+'</b>⚠️ Unanswered<br>✅ Correct answer: '+ca+'</div>'});let p=Math.round(score/40*100),m=p>=90?'Amazing work! You are a Maths Star! 🌟':p>=70?'Great job! Keep practising! ⭐':p>=50?'Good try! Keep practising! 💪':'Keep going! Practice makes you better! 🌈';result.innerHTML='<div class="score">🎉 '+score+' / 40</div><div class="percent">'+p+'%</div><div class="message">'+m+'</div><div class="review">'+html+'</div><button class="try" onclick="location.reload()">🔄 Try Again</button>';result.style.display='block';submit.style.display='none';result.scrollIntoView({behavior:'smooth'})};render();updateProgress();
</script></body></html>
