<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 1 Maths Quiz - Lines, Shapes, Patterns & Solid Shapes</title>
<style>
  :root{
    --green:#3d8b55;
    --green-dark:#27663b;
    --mint:#eaf7ee;
    --yellow:#fff5c7;
    --pink:#ffe8ee;
    --blue:#e9f4ff;
    --purple:#f0eaff;
    --ink:#263238;
    --muted:#68757d;
    --card:#ffffff;
    --border:#dce7df;
    --shadow:0 8px 24px rgba(42,72,52,.10);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#f4fbf6 0%,#fffdf5 100%);
  }
  .app{max-width:1050px;margin:auto;padding:20px 16px 42px}
  header{
    background:var(--card);border:1px solid var(--border);border-radius:24px;
    padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .badge{
    width:52px;height:52px;border-radius:16px;background:var(--green);
    display:grid;place-items:center;color:white;font-size:28px;
  }
  h1{margin:0;font-size:clamp(22px,4vw,34px);color:var(--green-dark)}
  .subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}
  .progress-wrap{margin-top:18px}
  .progress-top{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}
  .progress{height:12px;background:#e5eee8;border-radius:99px;overflow:hidden}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,#3d8b55,#7fbe66);transition:.25s}
  .section-title{
    margin:22px 2px 10px;font-size:18px;color:var(--green-dark);
    display:flex;align-items:center;gap:8px
  }
  .question{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin:12px 0;
  }
  .qhead{display:flex;gap:10px;align-items:flex-start}
  .qnum{
    flex:0 0 36px;height:36px;border-radius:12px;background:var(--green);
    color:#fff;display:grid;place-items:center;font-weight:800;
  }
  .qtext{font-size:17px;font-weight:700;line-height:1.45;margin-top:4px}
  .visual{
    margin:14px 0 10px;padding:14px;border-radius:14px;background:#fbfcfa;
    border:1px dashed #cddbd1;display:flex;justify-content:center;align-items:center;
    min-height:82px;overflow:hidden
  }
  .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:13px}
  .option{
    border:2px solid #dce6e0;background:#fff;border-radius:14px;padding:12px;
    cursor:pointer;text-align:left;font-size:15px;min-height:50px;transition:.15s;
    display:flex;align-items:center;gap:9px
  }
  .option:hover{border-color:#7fb58e;transform:translateY(-1px)}
  .option.selected{border-color:var(--green);background:var(--mint)}
  .letter{
    width:28px;height:28px;border-radius:50%;background:#edf3ef;
    display:grid;place-items:center;font-weight:800;color:var(--green-dark);flex:0 0 28px
  }
  .option.selected .letter{background:var(--green);color:#fff}
  .mini-shape{display:inline-block;vertical-align:middle}
  .circle{width:32px;height:32px;border:3px solid #4b77a7;border-radius:50%}
  .square{width:32px;height:32px;border:3px solid #d97948}
  .rect{width:50px;height:30px;border:3px solid #5a9d63}
  .triangle{width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-bottom:34px solid #ef8a5b}
  .oval{width:25px;height:38px;border:3px solid #8a6db2;border-radius:50%}
  .result{
    display:none;background:#fff;border:1px solid var(--border);border-radius:24px;
    box-shadow:var(--shadow);padding:24px;margin-top:22px
  }
  .result.show{display:block}
  .score-card{
    text-align:center;background:linear-gradient(135deg,#eff9f1,#fff8dc);
    border-radius:20px;padding:24px
  }
  .trophy{font-size:44px}
  .score{font-size:42px;font-weight:900;color:var(--green-dark);margin:4px}
  .message{font-size:18px;font-weight:700}
  .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .stat{padding:9px 13px;border-radius:999px;background:white;border:1px solid var(--border);font-weight:700}
  .review{margin-top:20px}
  .review-item{border-radius:14px;padding:13px 15px;margin:9px 0;border-left:6px solid #bbb;background:#f7f9f8}
  .review-item.correct{border-left-color:#4e9b60;background:#eff9f1}
  .review-item.wrong{border-left-color:#d85b5b;background:#fff0f0}
  .review-item.unanswered{border-left-color:#e0a33c;background:#fff8e8}
  .review-q{font-weight:800;margin-bottom:5px}
  .review-line{font-size:14px;margin:3px 0}
  .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
  button{
    border:0;border-radius:15px;padding:13px 20px;font-size:16px;font-weight:800;
    cursor:pointer
  }
  .submit{background:var(--green);color:#fff;box-shadow:0 5px 14px rgba(61,139,85,.25)}
  .submit:hover{background:var(--green-dark)}
  .retry{background:#fff;border:2px solid var(--green);color:var(--green-dark)}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:9px}
  .shape-row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
  .shape-box{width:58px;height:58px;display:grid;place-items:center;background:#fff}
  svg{max-width:100%;height:auto}
  .seq{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:26px}
  .sq{width:34px;height:34px;border-radius:4px;border:2px solid #78909c}
  .dot{width:30px;height:30px;border-radius:50%;border:2px solid #78909c}
  .tri{width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-bottom:30px solid #e77c55}
  .num-box{padding:8px 13px;background:#eef7ff;border:2px solid #91b9d8;border-radius:10px;font-weight:800}
  .solid-row{display:flex;gap:25px;align-items:end;justify-content:center;flex-wrap:wrap}
  .cube3d,.cuboid3d,.cylinder3d,.cone3d,.sphere3d{
    position:relative;display:inline-block
  }
  .cube3d{width:48px;height:48px;background:#f2c66d;border:2px solid #9b7735;transform:skewY(-10deg)}
  .cuboid3d{width:65px;height:42px;background:#b8d7ee;border:2px solid #5c86a3}
  .cylinder3d{width:45px;height:58px;background:#d8a7e6;border:2px solid #875e91;border-radius:50%/14%}
  .sphere3d{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 7%,#f49b76 8% 100%);border:2px solid #a96850}
  .cone3d{width:0;height:0;border-left:29px solid transparent;border-right:29px solid transparent;border-bottom:62px solid #f29b62}
  .line-demo{width:180px;height:65px}
  @media(max-width:640px){
    .app{padding:12px 10px 30px}
    header{padding:17px;border-radius:19px}
    .options{grid-template-columns:1fr}
    .question{padding:14px}
    .qtext{font-size:16px}
    .visual{min-height:70px}
  }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="badge">🔢</div>
    <div>
      <h1>Class 1 Maths Quiz</h1>
      <p class="subtitle">Lines • Shapes • Patterns • Solid Shapes</p>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-top"><span>Quiz Progress</span><span id="progressText">0 of 40 answered</span></div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>
</header>

<form id="quiz"></form>

<div class="actions" id="submitArea">
  <button type="button" class="submit" id="submitBtn">✅ Submit Answers</button>
</div>
<div class="note">Choose one answer for every question. You can change an answer before submitting.</div>

<section class="result" id="result">
  <div class="score-card">
    <div class="trophy">🎉</div>
    <div class="score" id="scoreText">0 / 40</div>
    <div id="percentText">0%</div>
    <p class="message" id="messageText"></p>
    <div class="stats">
      <div class="stat" id="correctStat">✅ Correct: 0</div>
      <div class="stat" id="wrongStat">❌ Wrong: 0</div>
      <div class="stat" id="unansweredStat">⭕ Unanswered: 0</div>
    </div>
  </div>
  <div class="review">
    <h2>📘 Question-by-Question Review</h2>
    <div id="reviewList"></div>
  </div>
  <div class="actions"><button type="button" class="retry" id="retryBtn">🔄 Try Again</button></div>
</section>
</div>

<script>
const questions = [
{section:"Types of Lines",q:"Which type of line goes from left to right?",visual:`<svg class="line-demo" viewBox="0 0 180 65"><line x1="15" y1="32" x2="165" y2="32" stroke="#3d8b55" stroke-width="5"/><circle cx="15" cy="32" r="5" fill="#f2b94b"/><circle cx="165" cy="32" r="5" fill="#f2b94b"/></svg>`,o:["Horizontal line","Vertical line","Slanting line","Curved line"],a:0},
{section:"Types of Lines",q:"Which line goes up and down?",visual:`<svg class="line-demo" viewBox="0 0 180 65"><line x1="90" y1="8" x2="90" y2="57" stroke="#4b77a7" stroke-width="5"/></svg>`,o:["Curved line","Vertical line","Horizontal line","Slanting line"],a:1},
{section:"Types of Lines",q:"Which line is leaning to one side?",visual:`<svg class="line-demo" viewBox="0 0 180 65"><line x1="35" y1="55" x2="145" y2="10" stroke="#d97948" stroke-width="5"/></svg>`,o:["Vertical line","Horizontal line","Slanting line","Curved line"],a:2},
{section:"Types of Lines",q:"Which one is a curved line?",visual:`<svg class="line-demo" viewBox="0 0 180 65"><path d="M15 45 Q90 0 165 45" fill="none" stroke="#8a6db2" stroke-width="5"/></svg>`,o:["A straight line","A curved line","A vertical line","A horizontal line"],a:1},
{section:"Types of Lines",q:"A line that does not bend is called a ______ line.",o:["Curved","Straight","Round","Wavy"],a:1},
{section:"Types of Lines",q:"Which shape has 4 straight sides that are all equal?",visual:`<div class="shape-row"><span class="mini-shape circle"></span><span class="mini-shape square"></span><span class="mini-shape oval"></span><span class="mini-shape triangle"></span></div>`,o:["Circle","Oval","Square","Triangle"],a:2},
{section:"Types of Lines",q:"Which shape has a curved boundary?",visual:`<div class="shape-row"><span class="mini-shape circle"></span><span class="mini-shape square"></span><span class="mini-shape rect"></span></div>`,o:["Circle","Square","Rectangle","None"],a:0},
{section:"Types of Lines",q:"How many straight lines make a square?",visual:`<div class="shape-row"><span class="mini-shape square"></span></div>`,o:["2","3","4","5"],a:2},
{section:"Types of Lines",q:"How many straight sides does a triangle have?",visual:`<div class="shape-row"><span class="mini-shape triangle"></span></div>`,o:["2","3","4","5"],a:1},
{section:"Types of Lines",q:"Which is an open line?",visual:`<svg viewBox="0 0 230 65" width="230"><path d="M20 50 L65 15 L110 50 L155 15" fill="none" stroke="#3d8b55" stroke-width="5"/><path d="M185 15 L185 50 L215 50 L215 15 Z" fill="none" stroke="#d97948" stroke-width="5"/></svg>`,o:["The line that does not join at its ends","The line that joins at its ends","A circle","A square"],a:0},

{section:"Shapes",q:"Which shape has 3 sides?",visual:`<div class="shape-row"><span class="mini-shape triangle"></span></div>`,o:["Circle","Triangle","Square","Rectangle"],a:1},
{section:"Shapes",q:"Which shape has 4 equal sides?",visual:`<div class="shape-row"><span class="mini-shape square"></span></div>`,o:["Triangle","Circle","Square","Oval"],a:2},
{section:"Shapes",q:"Which shape has 4 sides, with two long and two short sides?",visual:`<div class="shape-row"><span class="mini-shape rect"></span></div>`,o:["Rectangle","Triangle","Circle","Oval"],a:0},
{section:"Shapes",q:"Which shape has no corners?",visual:`<div class="shape-row"><span class="mini-shape circle"></span></div>`,o:["Square","Triangle","Circle","Rectangle"],a:2},
{section:"Shapes",q:"How many corners does a rectangle have?",o:["2","3","4","5"],a:2},
{section:"Shapes",q:"How many sides does a square have?",o:["3","4","5","6"],a:1},
{section:"Shapes",q:"Which shape is round and stretched like an egg?",visual:`<div class="shape-row"><span class="mini-shape oval"></span></div>`,o:["Triangle","Oval","Square","Rectangle"],a:1},
{section:"Shapes",q:"Which one is NOT a 2-D flat shape?",visual:`<div class="solid-row"><span class="mini-shape square"></span><span class="mini-shape circle"></span><span class="cube3d"></span></div>`,o:["Circle","Square","Triangle","Cube"],a:3},
{section:"Shapes",q:"Which group contains only flat shapes?",visual:`<div class="shape-row"><span class="mini-shape circle"></span><span class="mini-shape triangle"></span><span class="mini-shape rect"></span></div>`,o:["Circle, triangle, rectangle","Cube, sphere, cone","Cylinder, cube, square","Sphere, circle, cone"],a:0},
{section:"Shapes",q:"Look at the shapes. Which one has the greatest number of sides?",visual:`<div class="shape-row"><span class="mini-shape triangle"></span><span class="mini-shape square"></span><span class="mini-shape rect"></span></div>`,o:["Triangle","Square","Rectangle","They all have the same"],a:3},

{section:"Patterns",q:"What comes next? ⭐ 🌙 ⭐ 🌙 ⭐ __",visual:`<div class="seq">⭐ 🌙 ⭐ 🌙 ⭐ <b>?</b></div>`,o:["⭐","🌙","🔺","🟢"],a:1},
{section:"Patterns",q:"What comes next? 🟦 🟦 🟩 🟦 🟦 🟩 __",visual:`<div class="seq">🟦 🟦 🟩 🟦 🟦 🟩 <b>?</b></div>`,o:["🟩","🟦","🟥","🟨"],a:1},
{section:"Patterns",q:"Find the missing shape: ▲ ● ▲ ● ▲ __",visual:`<div class="seq">▲ ● ▲ ● ▲ <b>?</b></div>`,o:["▲","●","■","◆"],a:1},
{section:"Patterns",q:"What comes next? 🔴 🔵 🔵 🔴 🔵 🔵 __",visual:`<div class="seq">🔴 🔵 🔵 🔴 🔵 🔵 <b>?</b></div>`,o:["🔵","🔴","🟢","🟡"],a:1},
{section:"Patterns",q:"Which is a repeating pattern?",visual:`<div class="seq">🟩 🟨 🟩 🟨 🟩 🟨</div>`,o:["🟩 🟨 🟩 🟨","🟩 🟩 🟩 🟩","🟨 🟨 🟨 🟨","🟩 🟨 🟥 🟦"],a:0},
{section:"Patterns",q:"Which is a pattern found in nature?",o:["Leaf shapes","Brick wall","Tiled floor","Fence"],a:0},
{section:"Patterns",q:"Which is a man-made pattern?",o:["Leaf arrangement","Flower petals","Brick wall","Spots on an animal"],a:2},
{section:"Patterns",q:"What number comes next? 2, 4, 6, 8, __",visual:`<div class="seq"><span class="num-box">2</span><span class="num-box">4</span><span class="num-box">6</span><span class="num-box">8</span><span class="num-box">?</span></div>`,o:["9","10","11","12"],a:1},
{section:"Patterns",q:"What number comes next? 5, 10, 15, __",visual:`<div class="seq"><span class="num-box">5</span><span class="num-box">10</span><span class="num-box">15</span><span class="num-box">?</span></div>`,o:["18","19","20","25"],a:2},
{section:"Patterns",q:"What number comes next? 20, 18, 16, __",visual:`<div class="seq"><span class="num-box">20</span><span class="num-box">18</span><span class="num-box">16</span><span class="num-box">?</span></div>`,o:["15","14","13","12"],a:1},
{section:"Patterns",q:"Complete the pattern: 3, 6, 9, __, 15",visual:`<div class="seq"><span class="num-box">3</span><span class="num-box">6</span><span class="num-box">9</span><span class="num-box">?</span><span class="num-box">15</span></div>`,o:["10","11","12","13"],a:2},
{section:"Patterns",q:"What comes next in the colour pattern? 🟥 🟦 🟥 🟦 __",visual:`<div class="seq">🟥 🟦 🟥 🟦 <b>?</b></div>`,o:["🟥","🟦","🟩","🟨"],a:0},

{section:"Solid Shapes",q:"Which solid shape looks like a ball?",visual:`<div class="solid-row"><span class="sphere3d"></span></div>`,o:["Cube","Sphere","Cone","Cylinder"],a:1},
{section:"Solid Shapes",q:"Which solid shape has a circular top and comes to a point?",visual:`<div class="solid-row"><span class="cone3d"></span></div>`,o:["Sphere","Cube","Cone","Cuboid"],a:2},
{section:"Solid Shapes",q:"Which solid shape looks like a can?",visual:`<div class="solid-row"><span class="cylinder3d"></span></div>`,o:["Cylinder","Cube","Cone","Sphere"],a:0},
{section:"Solid Shapes",q:"Which solid shape has 6 square faces?",visual:`<div class="solid-row"><span class="cube3d"></span></div>`,o:["Cube","Cone","Sphere","Cylinder"],a:0},
{section:"Solid Shapes",q:"Which solid shape is like a box or a brick?",visual:`<div class="solid-row"><span class="cuboid3d"></span></div>`,o:["Sphere","Cuboid","Cone","Cylinder"],a:1},
{section:"Solid Shapes",q:"A dice is usually shaped like a ______.",visual:`<div class="solid-row"><span class="cube3d"></span> 🎲</div>`,o:["Sphere","Cube","Cone","Cylinder"],a:1},
{section:"Solid Shapes",q:"An ice-cream cone is shaped like a ______.",visual:`<div class="solid-row"><span class="cone3d"></span> 🍦</div>`,o:["Cone","Cube","Sphere","Cuboid"],a:0},
{section:"Solid Shapes",q:"Which object is most like a sphere?",visual:`<div class="seq">⚽ 📦 🍦 🥫</div>`,o:["Football","Box","Ice-cream cone","Can"],a:0}
];

const quiz = document.getElementById("quiz");
let answers = Array(questions.length).fill(null);

function render(){
  quiz.innerHTML="";
  let last="";
  questions.forEach((x,i)=>{
    if(x.section!==last){
      const st=document.createElement("div");
      st.className="section-title";
      st.innerHTML = (x.section==="Types of Lines"?"📏":x.section==="Shapes"?"🔷":x.section==="Patterns"?"🔁":"🧊")+" "+x.section;
      quiz.appendChild(st);
      last=x.section;
    }
    const card=document.createElement("article");
    card.className="question";
    card.id="q"+i;
    const visual=x.visual?`<div class="visual">${x.visual}</div>`:"";
    const opts=x.o.map((opt,j)=>`
      <button type="button" class="option ${answers[i]===j?'selected':''}" data-q="${i}" data-a="${j}">
        <span class="letter">${String.fromCharCode(65+j)}</span><span>${opt}</span>
      </button>`).join("");
    card.innerHTML=`<div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${x.q}</div></div>${visual}<div class="options">${opts}</div>`;
    quiz.appendChild(card);
  });
}
function updateProgress(){
  const count=answers.filter(a=>a!==null).length;
  document.getElementById("progressText").textContent=`${count} of 40 answered`;
  document.getElementById("progressBar").style.width=(count/40*100)+"%";
}
quiz.addEventListener("click",e=>{
  const btn=e.target.closest(".option");
  if(!btn)return;
  const q=Number(btn.dataset.q), a=Number(btn.dataset.a);
  answers[q]=a;
  document.querySelectorAll(`.option[data-q="${q}"]`).forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
  updateProgress();
});
document.getElementById("submitBtn").addEventListener("click",()=>{
  const correct=questions.reduce((n,x,i)=>n+(answers[i]===x.a?1:0),0);
  const unanswered=answers.filter(a=>a===null).length;
  const wrong=40-correct-unanswered;
  const pct=Math.round(correct/40*100);
  document.getElementById("scoreText").textContent=`${correct} / 40`;
  document.getElementById("percentText").textContent=`${pct}%`;
  document.getElementById("correctStat").textContent=`✅ Correct: ${correct}`;
  document.getElementById("wrongStat").textContent=`❌ Wrong: ${wrong}`;
  document.getElementById("unansweredStat").textContent=`⭕ Unanswered: ${unanswered}`;
  let msg="Keep practising — you are learning!";
  if(pct>=90)msg="Amazing work! You are a Maths Star! 🌟";
  else if(pct>=75)msg="Great job! Keep going! 🎉";
  else if(pct>=50)msg="Good try! A little more practice will make you stronger! 💪";
  document.getElementById("messageText").textContent=msg;
  const list=document.getElementById("reviewList");
  list.innerHTML=questions.map((x,i)=>{
    const status=answers[i]===null?"unanswered":answers[i]===x.a?"correct":"wrong";
    const your=answers[i]===null?"Not answered":x.o[answers[i]];
    return `<div class="review-item ${status}">
      <div class="review-q">${i+1}. ${x.q}</div>
      <div class="review-line">${status==="correct"?"✅ Correct!":status==="wrong"?"❌ Wrong":"⭕ Unanswered"}</div>
      <div class="review-line">Your answer: <b>${your}</b></div>
      ${status!=="correct"?`<div class="review-line">Correct answer: <b>${x.o[x.a]}</b></div>`:""}
    </div>`;
  }).join("");
  document.getElementById("result").classList.add("show");
  document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("retryBtn").addEventListener("click",()=>{
  answers=Array(40).fill(null);
  render(); updateProgress();
  document.getElementById("result").classList.remove("show");
  window.scrollTo({top:0,behavior:"smooth"});
});
render(); updateProgress();
</script>
</body>
</html>
