<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 1 Maths – Numbers, Patterns, Shapes & Counting</title>
<style>
:root{
  --green:#38b86b;--green-dark:#22864a;--red:#fa4b50;--blue:#dff0ff;
  --ink:#222;--muted:#66737a;--bg:#f6fbff;--card:#fff;--line:#dce7ee;
  --shadow:0 7px 20px rgba(40,70,90,.10)
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f7fbff,#fffdf7);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.app{max-width:1050px;margin:auto;padding:18px 14px 45px}
header{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.brand{display:flex;gap:13px;align-items:center}
.logo{width:52px;height:52px;border-radius:15px;background:var(--green);display:grid;place-items:center;font-size:28px}
h1{margin:0;color:var(--green-dark);font-size:clamp(23px,4vw,34px)}
.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}
.progress-head{display:flex;justify-content:space-between;margin-top:18px;margin-bottom:7px;font-size:14px;font-weight:800}
.progress{height:12px;background:#e7edf0;border-radius:99px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#38b86b,#79cf7f);transition:.2s}
.section-title{font-size:18px;color:var(--green-dark);font-weight:800;margin:22px 2px 10px}
.question{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:var(--shadow)}
.qtop{display:flex;gap:10px;align-items:flex-start}
.qnum{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}
.qtext{font-size:17px;font-weight:700;line-height:1.45;margin-top:5px}
.visual{margin:13px 0 11px;padding:12px;background:#fcfdff;border:1px dashed #cfdde6;border-radius:14px;min-height:72px;display:flex;align-items:center;justify-content:center;overflow:auto}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{min-height:52px;border:2px solid #dfe8ee;border-radius:13px;background:#fff;padding:10px 12px;cursor:pointer;text-align:left;font-size:15px;display:flex;align-items:center;gap:10px;transition:.15s}
.option:hover{border-color:#8fc9a2;transform:translateY(-1px)}
.option.selected{background:#effaf3;border-color:var(--green)}
.letter{width:29px;height:29px;border-radius:50%;background:#eaf3f9;display:grid;place-items:center;font-weight:900;flex:0 0 29px}
.option.selected .letter{background:var(--green);color:#fff}
.seq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:27px}
.number{padding:7px 13px;border-radius:9px;background:#eef7ff;border:2px solid #a6c9e4;font-weight:900}
.count-row{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:28px}
.butterfly-scene{width:min(560px,100%);display:flex;align-items:center;justify-content:center;gap:24px;min-height:76px}
.butterfly-group{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.butterfly{font-size:29px;line-height:1;display:inline-block;width:34px;height:34px;text-align:center}
.net-box{width:180px;height:74px;border:2px solid #a9b8c2;border-radius:12px;position:relative;background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(150,170,185,.12) 8px 10px),repeating-linear-gradient(-45deg,transparent 0 8px,rgba(150,170,185,.12) 8px 10px);display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;padding:8px 12px;overflow:hidden}
.net-label{font-size:12px;font-weight:800;color:#75838b;position:absolute;top:4px;left:8px;background:#fff;padding:1px 4px;border-radius:4px}
.car-diagram{width:min(430px,100%);height:auto;display:block;margin:auto}

.boxes{display:flex;gap:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap;width:100%}
.group-box{width:145px;min-height:88px;border:2px solid #8aa6b9;border-radius:6px;background:#fff;padding:8px;display:flex;align-items:center;justify-content:center}
.group-items{display:grid;grid-template-columns:repeat(3,30px);grid-auto-rows:30px;gap:2px 4px;justify-content:center;align-items:center;font-size:23px;line-height:1;white-space:nowrap}
.group-items.two{grid-template-columns:repeat(2,30px)}
.group-items.four{grid-template-columns:repeat(4,30px)}
.group-items.three{grid-template-columns:repeat(3,30px)}
.shape{display:inline-block}
.circle{width:42px;height:42px;border:3px solid #4c8ec7;border-radius:50%}
.square{width:42px;height:42px;border:3px solid #d178a7}
.rectangle{width:62px;height:38px;border:3px solid #d178a7}
.triangle{width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:42px solid #e57fa8}
.cloud{font-size:70px}
.solids{display:flex;gap:28px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.cube{width:58px;height:58px;background:#7fb3dc;border:2px solid #4f7798;position:relative;transform:skewY(-8deg)}
.cuboid{width:78px;height:48px;background:#c8e1f2;border:2px solid #6b91aa}
.sphere{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 7%,#7cc6ee 8% 100%);border:2px solid #5a92ae}
.cylinder{width:50px;height:62px;background:#e4a6d5;border:2px solid #9a6690;border-radius:50%/13%}
.cone{width:0;height:0;border-left:31px solid transparent;border-right:31px solid transparent;border-bottom:68px solid #e6a26d}
.actions{text-align:center;margin:24px 0 5px}
button.main{border:0;border-radius:14px;background:var(--green);color:#fff;padding:14px 22px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(56,184,107,.24)}
button.main:hover{background:var(--green-dark)}
.note{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.result{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px;margin-top:20px}
.result.show{display:block}
.score-card{text-align:center;padding:22px;border-radius:18px;background:linear-gradient(135deg,#effaf2,#fff8df)}
.trophy{font-size:44px}.score{font-size:42px;font-weight:900;color:var(--green-dark)}
.message{font-size:18px;font-weight:800}
.stats{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:800}
.review h2{font-size:21px;color:var(--green-dark)}
.review-item{padding:13px 15px;margin:8px 0;border-radius:13px;border-left:6px solid #aaa;background:#f7f9fa}
.review-item.correct{border-left-color:var(--green);background:#effaf2}
.review-item.wrong{border-left-color:var(--red);background:#fff0f0}
.review-item.unanswered{border-left-color:#e0a53b;background:#fff8e7}
.review-q{font-weight:800;margin-bottom:5px}.review-line{font-size:14px;margin:3px 0}
.retry{margin-top:20px;background:#fff;border:2px solid var(--green-dark);color:var(--green-dark);border-radius:14px;padding:12px 20px;font-weight:900;cursor:pointer}

/* Enhanced butterfly net artwork — scoped to Q2/Q3 only */
.butterfly-scene{min-height:120px!important;gap:24px!important}
.net-box{
  width:205px!important;height:105px!important;border:4px solid #79a7c2!important;
  border-radius:20px 20px 28px 28px!important;
  background:#f9fdff!important;overflow:visible!important;
  box-shadow:0 5px 12px rgba(75,125,155,.15),inset 0 0 0 3px #fff!important;
}
.net-mesh-art{
  position:absolute;inset:5px;border-radius:14px 14px 22px 22px;
  background:
    linear-gradient(45deg,transparent 45%,rgba(99,145,170,.18) 46%,rgba(99,145,170,.18) 51%,transparent 52%),
    linear-gradient(-45deg,transparent 45%,rgba(99,145,170,.18) 46%,rgba(99,145,170,.18) 51%,transparent 52%),
    #f5fbff;
  background-size:16px 16px;
}
.net-label{
  z-index:5!important;left:10px!important;top:6px!important;
  background:#fff!important;color:#52748a!important;font-size:11px!important;
  font-weight:900!important;padding:3px 7px!important;border-radius:9px!important;
}
.net-handle-art{
  position:absolute;right:-78px;bottom:12px;width:82px;height:10px;
  background:#eaa16c;border:3px solid #b96e45;border-radius:10px;
  transform:rotate(-8deg);transform-origin:left center;z-index:1;
}
.outside-butterflies{z-index:3}
.outside-butterflies .butterfly{font-size:32px!important}
.inside-scene{position:relative}
.big-net{width:225px!important;height:112px!important}
.inside-butterflies{
  position:absolute;z-index:4;left:18px;right:12px;top:27px;bottom:9px;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
  align-items:center;gap:4px 10px;
}
.inside-butterflies .butterfly{font-size:28px!important}
.small-outside{gap:4px!important;flex-direction:column}
.small-outside .butterfly{font-size:26px!important}
@media(max-width:650px){
  .butterfly-scene{gap:10px!important}
  .net-box{width:180px!important;height:98px!important}
  .big-net{width:195px!important;height:105px!important}
  .net-handle-art{right:-58px;width:62px}
  .outside-butterflies .butterfly{font-size:28px!important}
  .inside-butterflies .butterfly{font-size:25px!important}
}

@media(max-width:650px){.app{padding:10px 9px 35px}.question{padding:14px}.options{grid-template-columns:1fr}.qtext{font-size:16px}.visual{min-height:64px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">🧮</div><div><h1>Class 1 Maths Quiz</h1><p class="subtitle">Counting • Number Patterns • Position • Shapes • Solid Shapes</p></div></div>
  <div class="progress-head"><span>Quiz Progress</span><span id="progressText">0 of 40 answered</span></div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</header>

<form id="quiz"></form>
<div class="actions"><button class="main" type="button" id="submit">✅ Submit Answers</button></div>
<div class="note">Choose one answer for each question. You can change your answer before submitting.</div>

<section class="result" id="result">
  <div class="score-card">
    <div class="trophy">🎉</div>
    <div class="score" id="score"></div>
    <div id="percent"></div>
    <p class="message" id="message"></p>
    <div class="stats">
      <span class="stat" id="correct"></span><span class="stat" id="wrong"></span><span class="stat" id="unanswered"></span>
    </div>
  </div>
  <div class="review"><h2>📘 Complete Question-by-Question Review</h2><div id="reviewList"></div></div>
  <div style="text-align:center"><button class="retry" type="button" id="retry">🔄 Try Again</button></div>
</section>
</div>

<script>
const Q=[
{sec:"Counting Objects",q:"How many circles are there in the given figure?",v:`<svg class="car-diagram" viewBox="0 0 420 150" role="img" aria-label="A vehicle with seven visible circles"><path d="M62 76 L113 39 L360 39 L360 111 L113 111 L113 39 M113 111 L62 76 M113 39 L113 111" fill="none" stroke="#279ad1" stroke-width="3" stroke-linejoin="round"/><rect x="150" y="57" width="155" height="47" fill="none" stroke="#279ad1" stroke-width="3"/><circle cx="83" cy="76" r="15" fill="none" stroke="#c8d91c" stroke-width="3"/><circle cx="377" cy="61" r="15" fill="none" stroke="#c8d91c" stroke-width="3"/><circle cx="377" cy="91" r="15" fill="none" stroke="#c8d91c" stroke-width="3"/><circle cx="154" cy="128" r="15" fill="none" stroke="#c8d91c" stroke-width="3"/><circle cx="154" cy="128" r="7" fill="none" stroke="#c8d91c" stroke-width="2"/><circle cx="280" cy="128" r="15" fill="none" stroke="#c8d91c" stroke-width="3"/><circle cx="280" cy="128" r="7" fill="none" stroke="#c8d91c" stroke-width="2"/></svg>`,o:["5","6","7","8"],a:2},
{sec:"Counting Objects",q:"How many butterflies are outside the net?",v:`<div class="butterfly-scene"><div class="butterfly-group outside-butterflies"><span class="butterfly">🦋</span><span class="butterfly">🦋</span><span class="butterfly">🦋</span></div><div class="net-box"><span class="net-label">NET</span><div class="net-mesh-art"></div><div class="net-handle-art"></div></div></div>`,o:["2","3","4","5"],a:1},
{sec:"Counting Objects",q:"How many butterflies are inside the net?",v:`<div class="butterfly-scene inside-scene"><div class="butterfly-group outside-butterflies small-outside"><span class="butterfly">🦋</span><span class="butterfly">🦋</span></div><div class="net-box big-net"><span class="net-label">NET</span><div class="net-mesh-art"></div><div class="inside-butterflies"><span class="butterfly">🦋</span><span class="butterfly">🦋</span><span class="butterfly">🦋</span><span class="butterfly">🦋</span><span class="butterfly">🦋</span></div><div class="net-handle-art"></div></div></div>`,o:["3","4","5","6"],a:2},
{sec:"Counting Objects",q:"How many chickens are there altogether?",v:`<div class="count-row">🐥 🐥 🐥 🐥 🐥 🐥 🐥 🐥 🐥 🐥 🐥 🐥 🐥</div>`,o:["1 ten 3 ones","1 ten 4 ones","3 tens","13 tens"],a:0},
{sec:"Counting Objects",q:"Which group has the most lollipops?",v:`<div class="boxes"><div class="group-box"><div class="group-items"><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span></div></div><div class="group-box"><div class="group-items"><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span></div></div><div class="group-box"><div class="group-items"><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span><span>🍭</span></div></div></div>`,o:["J","K","L","They are equal"],a:0},
{sec:"Counting Objects",q:"Which group has the least number of objects?",v:`<div class="boxes"><div class="group-box"><div class="group-items four"><span>🍎</span><span>🍎</span><span>🍎</span><span>🍎</span></div></div><div class="group-box"><div class="group-items two"><span>🍎</span><span>🍎</span></div></div><div class="group-box"><div class="group-items three"><span>🍎</span><span>🍎</span><span>🍎</span></div></div></div>`,o:["A","B","C","All are equal"],a:1},
{sec:"Counting Objects",q:"There are 12 flowers. 2 flowers are taken away. How many are left?",v:`<div class="count-row">🌸🌸🌸🌸🌸🌸🌸🌸🌸🌸🌸🌸</div>`,o:["8","9","10","11"],a:2},
{sec:"Number Patterns",q:"Find the missing number: 27, 24, 21, __, 15.",v:`<div class="seq"><span class="number">27</span><span class="number">24</span><span class="number">21</span><span class="number">?</span><span class="number">15</span></div>`,o:["20","19","18","17"],a:2},
{sec:"Number Patterns",q:"Find the missing number: 10, 20, 30, __, 50.",v:`<div class="seq"><span class="number">10</span><span class="number">20</span><span class="number">30</span><span class="number">?</span><span class="number">50</span></div>`,o:["35","40","45","60"],a:1},
{sec:"Number Patterns",q:"What comes next? 2, 4, 6, 8, __",v:`<div class="seq">2 → 4 → 6 → 8 → ?</div>`,o:["9","10","11","12"],a:1},
{sec:"Number Patterns",q:"What comes next? 5, 10, 15, __",v:`<div class="seq">5 → 10 → 15 → ?</div>`,o:["18","20","25","30"],a:1},
{sec:"Number Patterns",q:"What comes next? 20, 18, 16, __",v:`<div class="seq">20 → 18 → 16 → ?</div>`,o:["15","14","13","12"],a:1},
{sec:"Number Patterns",q:"Complete the pattern: 3, 6, 9, __, 15.",v:`<div class="seq">3 → 6 → 9 → ? → 15</div>`,o:["10","11","12","13"],a:2},
{sec:"Position & Order",q:"Which object is fourth from the right end?",v:`<div class="seq">🍎 🍦 🦋 🧸 🪁 🎈</div>`,o:["🍎","🍦","🦋","🧸"],a:2},
{sec:"Position & Order",q:"Which object is first from the left?",v:`<div class="seq">🍎 🍦 🦋 🧸 🪁 🎈</div>`,o:["🍎","🍦","🦋","🎈"],a:0},
{sec:"Position & Order",q:"Which object is second from the right?",v:`<div class="seq">🐱 🐶 🐰 🐼 🦊</div>`,o:["🐱","🐰","🐼","🦊"],a:2},
{sec:"Position & Order",q:"Which object is third from the left?",v:`<div class="seq">⭐ 🌙 ☀️ ☁️ 🌈</div>`,o:["⭐","🌙","☀️","☁️"],a:2},
{sec:"Position & Order",q:"Which object is fifth from the left?",v:`<div class="seq">🚌 🚗 🚲 🛴 🚂 🚁</div>`,o:["🚲","🛴","🚂","🚁"],a:2},
{sec:"Figure Patterns",q:"Find the next two emoji figures: 😟 😐 😊 🙂 😟 😐 😊 🙂 😟 😐 __ __",v:`<div class="seq">😟 😐 😊 🙂 😟 😐 😊 🙂 😟 😐 <b>?</b> <b>?</b></div>`,o:["😊 🙂","🙂 😊","😟 😐","😐 😟"],a:0},
{sec:"Figure Patterns",q:"What comes next? 🔴 🔵 🔴 🔵 🔴 __",v:`<div class="seq">🔴 🔵 🔴 🔵 🔴 ?</div>`,o:["🔴","🔵","🟢","🟡"],a:1},
{sec:"Figure Patterns",q:"What comes next? 🟩 🟨 🟩 🟨 🟩 __",v:`<div class="seq">🟩 🟨 🟩 🟨 🟩 ?</div>`,o:["🟩","🟨","🟥","🟦"],a:1},
{sec:"Figure Patterns",q:"What comes next? ▲ ● ▲ ● ▲ __",v:`<div class="seq">▲ ● ▲ ● ▲ ?</div>`,o:["▲","●","■","◆"],a:1},
{sec:"Figure Patterns",q:"Which is the correct repeating pattern?",v:`<div class="seq">🟢 🟡 🟢 🟡 🟢 🟡</div>`,o:["🟢 🟡 🟢 🟡","🟢 🟢 🟡 🟡","🟢 🔴 🟡 🔵","🟡 🟡 🟡 🟡"],a:0},
{sec:"Tens and Ones",q:"13 is equal to:",v:`<div class="seq"><span class="number">13</span></div>`,o:["1 ten 3 ones","3 tens 1 one","1 ten 4 ones","13 tens"],a:0},
{sec:"Tens and Ones",q:"14 is equal to:",v:`<div class="seq"><span class="number">14</span></div>`,o:["4 tens 1 one","1 ten 4 ones","1 ten 3 ones","14 ones only"],a:1},
{sec:"Tens and Ones",q:"Which number has 2 tens and 5 ones?",v:`<div class="boxes"><div class="box">10</div><div class="box">10</div><div class="box">1</div><div class="box">1</div><div class="box">1</div><div class="box">1</div><div class="box">1</div></div>`,o:["20","24","25","52"],a:2},
{sec:"Tens and Ones",q:"There are 16 objects. How many tens and ones?",v:`<div class="seq">16 = ? ten + ? ones</div>`,o:["1 ten 5 ones","1 ten 6 ones","6 tens 1 one","2 tens 6 ones"],a:1},
{sec:"Tens and Ones",q:"Which number has 3 tens and 2 ones?",v:`<div class="seq"><span class="number">3 tens</span> + <span class="number">2 ones</span></div>`,o:["23","30","32","35"],a:2},
{sec:"Numbers & Number Names",q:"Which number is NOT on the blackboard?",v:`<div class="visual" style="margin:0;background:#1e5b4f;color:#fff;font-size:25px;font-weight:900;letter-spacing:10px">42 &nbsp; 93 &nbsp; 56<br>66 &nbsp; 84 &nbsp; 37<br>13</div>`,o:["Ninety-three","Sixty-six","Fifty-five","Eighty-four"],a:2},
{sec:"Numbers & Number Names",q:"Which number is 'sixty-six'?",v:`<div class="seq">66 &nbsp; 60 &nbsp; 76 &nbsp; 96</div>`,o:["60","66","76","96"],a:1},
{sec:"Numbers & Number Names",q:"Which number is 'ninety-three'?",v:`<div class="seq">39 &nbsp; 93 &nbsp; 83 &nbsp; 90</div>`,o:["39","83","90","93"],a:3},
{sec:"Numbers & Number Names",q:"Which number is 'forty-two'?",v:`<div class="seq">24 &nbsp; 42 &nbsp; 52 &nbsp; 40</div>`,o:["24","40","42","52"],a:2},
{sec:"Shapes",q:"Which shape is NOT present in the cloud?",v:`<div class="visual"><svg width="300" height="120" viewBox="0 0 300 120"><path d="M35 75 C10 60 25 25 58 30 C70 2 118 5 128 28 C160 5 210 15 211 44 C248 32 275 55 260 82 C274 105 238 119 210 103 C190 125 143 120 132 97 C103 118 58 112 57 91 C30 98 14 88 35 75Z" fill="#fff" stroke="#3b8bc0" stroke-width="4"/><g fill="none" stroke="#b35b9b" stroke-width="2"><rect x="72" y="39" width="42" height="20"/><rect x="145" y="67" width="42" height="20"/><rect x="208" y="57" width="22" height="22"/><path d="M49 67 l14 -20 l14 20z M120 78 l14 -20 l14 20z M175 42 l14 -20 l14 20z M190 91 l14 -20 l14 20z"/></g></svg></div>`,o:["Triangle","Circle","Rectangle","Square"],a:1},
{sec:"Shapes",q:"How many sides does a triangle have?",v:`<span class="shape triangle"></span>`,o:["2","3","4","5"],a:1},
{sec:"Shapes",q:"How many sides does a rectangle have?",v:`<span class="shape rectangle"></span>`,o:["2","3","4","5"],a:2},
{sec:"Shapes",q:"Which shape has no corners?",v:`<span class="shape circle"></span>`,o:["Circle","Square","Triangle","Rectangle"],a:0},
{sec:"Solid Shapes",q:"Which of the following looks like a cone?",v:`<div class="solids"><span class="cube"></span><span class="cone"></span><span class="sphere"></span></div>`,o:["Cube","Cone","Sphere","Cuboid"],a:1},
{sec:"Solid Shapes",q:"Which solid shape looks like a ball?",v:`<div class="solids"><span class="sphere"></span></div>`,o:["Cube","Sphere","Cone","Cylinder"],a:1},
{sec:"Solid Shapes",q:"Which solid shape looks like a can?",v:`<div class="solids"><span class="cylinder"></span></div>`,o:["Cylinder","Cube","Cone","Sphere"],a:0},
{sec:"Solid Shapes",q:"A dice is usually shaped like a:",v:`<div class="solids"><span class="cube"></span> 🎲</div>`,o:["Sphere","Cube","Cone","Cylinder"],a:1}
];

let ans=Array(Q.length).fill(null);
const quiz=document.getElementById("quiz");
function render(){
 quiz.innerHTML="";let last="";
 Q.forEach((x,i)=>{
   if(x.sec!==last){let h=document.createElement("div");h.className="section-title";h.textContent=x.sec;quiz.appendChild(h);last=x.sec}
   let c=document.createElement("article");c.className="question";c.id="q"+i;
   c.innerHTML=`<div class="qtop"><div class="qnum">${i+1}</div><div class="qtext">${x.q}</div></div>${x.v?`<div class="visual">${x.v}</div>`:""}<div class="options">${x.o.map((z,j)=>`<button type="button" class="option ${ans[i]===j?"selected":""}" data-q="${i}" data-a="${j}"><span class="letter">${String.fromCharCode(65+j)}</span><span>${z}</span></button>`).join("")}</div>`;
   quiz.appendChild(c);
 });
}
function progress(){
 let n=ans.filter(x=>x!==null).length;
 document.getElementById("progressText").textContent=`${n} of 40 answered`;
 document.getElementById("progressBar").style.width=(n/40*100)+"%";
}
quiz.addEventListener("click",e=>{
 let b=e.target.closest(".option");if(!b)return;
 let q=+b.dataset.q,a=+b.dataset.a;ans[q]=a;
 document.querySelectorAll(`.option[data-q="${q}"]`).forEach(x=>x.classList.remove("selected"));
 b.classList.add("selected");progress();
});
document.getElementById("submit").onclick=()=>{
 let correct=0,un=0;
 Q.forEach((x,i)=>{if(ans[i]===null)un++;else if(ans[i]===x.a)correct++});
 let wrong=40-correct-un,p=Math.round(correct/40*100);
 document.getElementById("score").textContent=`${correct} / 40`;
 document.getElementById("percent").textContent=`${p}%`;
 document.getElementById("correct").textContent=`✅ Correct: ${correct}`;
 document.getElementById("wrong").textContent=`❌ Wrong: ${wrong}`;
 document.getElementById("unanswered").textContent=`⭕ Unanswered: ${un}`;
 document.getElementById("message").textContent=p>=90?"Amazing! You are a Maths Star! 🌟":p>=75?"Great job! Keep practising! 🎉":p>=50?"Good try! You are learning more every time! 💪":"Keep practising — you can do it! 🌈";
 document.getElementById("reviewList").innerHTML=Q.map((x,i)=>{
   let st=ans[i]===null?"unanswered":ans[i]===x.a?"correct":"wrong";
   let your=ans[i]===null?"Not answered":x.o[ans[i]];
   return `<div class="review-item ${st}"><div class="review-q">${i+1}. ${x.q}</div><div class="review-line">${st==="correct"?"✅ Correct answer":st==="wrong"?"❌ Wrong answer":"⭕ Unanswered"}</div><div class="review-line">Your answer: <b>${your}</b></div>${st!=="correct"?`<div class="review-line">Correct answer: <b>${x.o[x.a]}</b></div>`:""}</div>`;
 }).join("");
 document.getElementById("result").classList.add("show");
 document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
};
document.getElementById("retry").onclick=()=>{ans=Array(40).fill(null);render();progress();document.getElementById("result").classList.remove("show");scrollTo({top:0,behavior:"smooth"})};
render();progress();
</script>
</body>
</html>
