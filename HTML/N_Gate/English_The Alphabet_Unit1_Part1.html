<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Alphabet Quiz - Standard 1</title>
<style>
  :root{
    --pink:#ff6fa5;
    --purple:#8a63f2;
    --blue:#3ea6ff;
    --green:#3dd68c;
    --yellow:#ffcb3d;
    --orange:#ff9f43;
    --red:#ff5c5c;
    --card-bg:#ffffff;
    --text:#333355;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:0;
    font-family:"Comic Sans MS","Trebuchet MS","Segoe UI",Verdana,sans-serif;
    background:linear-gradient(135deg,#a1c4fd 0%,#c2e9fb 25%,#fbc2eb 50%,#fddb92 75%,#a1c4fd 100%);
    background-size:400% 400%;
    animation:bgshift 20s ease infinite;
    color:var(--text);
    min-height:100vh;
    padding-bottom:60px;
  }
  @keyframes bgshift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  header{
    text-align:center;
    padding:22px 12px 14px;
  }
  header h1{
    margin:0;
    font-size:clamp(1.6rem,5vw,2.6rem);
    color:#6a1b9a;
    text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,0.08);
  }
  header p{
    margin:6px 0 0;
    font-size:clamp(0.9rem,2.5vw,1.15rem);
    color:#4a2c6d;
    font-weight:bold;
  }
  .progress-wrap{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(4px);
    padding:10px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  .progress-label{
    text-align:center;
    font-weight:bold;
    color:var(--purple);
    margin-bottom:6px;
    font-size:clamp(0.85rem,2.2vw,1.05rem);
  }
  .progress-bar-bg{
    width:100%;
    max-width:700px;
    margin:0 auto;
    height:18px;
    background:#e8e8f4;
    border-radius:20px;
    overflow:hidden;
    border:2px solid #d0d0e8;
  }
  .progress-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--green),var(--blue));
    border-radius:20px;
    transition:width 0.35s ease;
  }
  .container{
    max-width:820px;
    margin:20px auto;
    padding:0 14px;
  }
  .question-card{
    background:var(--card-bg);
    border-radius:20px;
    padding:18px 18px 20px;
    margin-bottom:18px;
    box-shadow:0 6px 16px rgba(80,50,150,0.15);
    border:3px solid transparent;
    animation:pop 0.35s ease;
  }
  @keyframes pop{
    from{transform:scale(0.96);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  .q-number{
    display:inline-block;
    background:var(--purple);
    color:#fff;
    font-weight:bold;
    border-radius:50%;
    width:34px;
    height:34px;
    line-height:34px;
    text-align:center;
    margin-right:10px;
    font-size:0.95rem;
    flex-shrink:0;
  }
  .q-text-row{
    display:flex;
    align-items:flex-start;
    margin-bottom:14px;
  }
  .q-text{
    font-size:clamp(1rem,2.6vw,1.2rem);
    font-weight:bold;
    color:#2d2350;
    line-height:1.4;
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:520px){
    .options{grid-template-columns:1fr;}
  }
  .option-btn{
    background:#f4f2ff;
    border:2.5px solid #d9d3ff;
    border-radius:14px;
    padding:12px 14px;
    font-size:clamp(0.95rem,2.4vw,1.08rem);
    font-family:inherit;
    font-weight:bold;
    color:#463b6b;
    cursor:pointer;
    text-align:left;
    transition:all 0.15s ease;
  }
  .option-btn:hover{
    background:#e6defc;
    transform:translateY(-2px);
    border-color:var(--purple);
  }
  .option-btn.selected{
    background:linear-gradient(135deg,var(--blue),var(--purple));
    color:#fff;
    border-color:var(--purple);
    transform:scale(1.02);
  }
  .option-btn.correct-answer{
    background:linear-gradient(135deg,#43e97b,#38f9d7);
    color:#0b4a2e;
    border-color:var(--green);
  }
  .option-btn.wrong-answer{
    background:linear-gradient(135deg,#ff8a8a,#ff5c5c);
    color:#5a0000;
    border-color:var(--red);
  }
  .option-btn:disabled{
    cursor:default;
  }
  .status-icon{
    font-size:1.3rem;
    margin-left:8px;
  }
  .submit-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .big-btn{
    font-family:inherit;
    font-size:clamp(1.05rem,3vw,1.3rem);
    font-weight:bold;
    padding:16px 34px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,0.15);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .big-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  #submitBtn{
    background:linear-gradient(135deg,var(--green),#2bb673);
  }
  #tryAgainBtn{
    background:linear-gradient(135deg,var(--orange),var(--pink));
  }
  #resultsSection{
    display:none;
  }
  .score-card{
    background:#fff;
    border-radius:24px;
    padding:28px 20px;
    text-align:center;
    box-shadow:0 8px 20px rgba(80,50,150,0.2);
    margin-bottom:24px;
  }
  .score-card h2{
    font-size:clamp(1.5rem,5vw,2.2rem);
    color:#6a1b9a;
    margin:0 0 8px;
  }
  .score-big{
    font-size:clamp(2.2rem,8vw,3.2rem);
    font-weight:bold;
    color:var(--purple);
    margin:8px 0;
  }
  .percentage{
    font-size:clamp(1.2rem,4vw,1.6rem);
    font-weight:bold;
    color:var(--blue);
    margin-bottom:10px;
  }
  .encourage{
    font-size:clamp(1rem,3vw,1.3rem);
    font-weight:bold;
    color:#e0662a;
    background:#fff3e0;
    display:inline-block;
    padding:10px 18px;
    border-radius:16px;
    margin-top:8px;
  }
  .review-title{
    text-align:center;
    color:#6a1b9a;
    font-size:clamp(1.3rem,4vw,1.7rem);
    margin:20px 0 16px;
  }
  .review-card{
    background:#fff;
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:14px;
    box-shadow:0 4px 12px rgba(80,50,150,0.12);
    border-left:8px solid var(--green);
  }
  .review-card.wrong{
    border-left-color:var(--red);
  }
  .review-card.unanswered{
    border-left-color:var(--yellow);
  }
  .review-q{
    font-weight:bold;
    margin-bottom:8px;
    color:#2d2350;
  }
  .review-line{
    font-size:0.98rem;
    margin:4px 0;
  }
  .review-line.correct-line{color:#1d8a4f;}
  .review-line.wrong-line{color:#c62828;}
  .review-line.info-line{color:#8a6d00;}
  footer{
    text-align:center;
    color:#5a4a80;
    font-size:0.85rem;
    margin-top:30px;
    padding-bottom:10px;
  }
</style>
</head>
<body>

<header>
  <h1>🎈 The Alphabet Quiz 🎈</h1>
  <p>Standard 1 &middot; English Grammar &middot; Unit 1: The Alphabet</p>
</header>

<div class="progress-wrap">
  <div class="progress-label" id="progressLabel">0 of 40 answered</div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
</div>

<div class="container">
  <div id="quizSection"></div>

  <div class="submit-wrap" id="submitWrap">
    <button class="big-btn" id="submitBtn">✅ Submit Answers</button>
  </div>

  <div id="resultsSection">
    <div class="score-card">
      <h2>🎉 Quiz Complete!</h2>
      <div class="score-big" id="scoreBig">0 / 40</div>
      <div class="percentage" id="percentageText">0%</div>
      <div class="encourage" id="encourageText"></div>
    </div>

    <div class="review-title">📝 Question-by-Question Review</div>
    <div id="reviewList"></div>

    <div class="submit-wrap">
      <button class="big-btn" id="tryAgainBtn">🔄 Try Again</button>
    </div>
  </div>
</div>

<footer>Made with ❤️ for little learners</footer>

<script>
(function(){
  const RAW_QUESTIONS = [
    {q:"How many letters are there in the English alphabet?", options:["24","25","26","27"], correct:"26"},
    {q:"The English alphabet is written in how many ways?", options:["One way","Two ways","Three ways","Four ways"], correct:"Two ways"},
    {q:"What is the first letter of the English alphabet?", options:["A","B","Z","M"], correct:"A"},
    {q:"What is the last letter of the English alphabet?", options:["Y","Z","X","A"], correct:"Z"},
    {q:"Which of these is a CAPITAL letter?", options:["b","D","m","t"], correct:"D"},
    {q:"Which of these is a SMALL letter?", options:["G","k","R","M"], correct:"k"},
    {q:"A, B, C are examples of ___ letters.", options:["Capital","Small","Vowel","Number"], correct:"Capital"},
    {q:"a, b, c are examples of ___ letters.", options:["Capital","Small","Vowel","Number"], correct:"Small"},
    {q:"Which letter comes right after A?", options:["B","C","Z","A"], correct:"B"},
    {q:"Which letter comes right before D?", options:["C","E","B","F"], correct:"C"},
    {q:"Which letter comes right after M?", options:["L","N","O","K"], correct:"N"},
    {q:"Which letter comes between H and J?", options:["I","K","G","L"], correct:"I"},
    {q:"Fill in the missing letter: A, B, ___, D", options:["C","E","Z","F"], correct:"C"},
    {q:"Fill in the missing letter: X, Y, ___", options:["Z","W","V","A"], correct:"Z"},
    {q:"Fill in the missing letter: ___, F, G", options:["E","H","D","C"], correct:"E"},
    {q:"Which letter comes right before Q?", options:["P","R","O","S"], correct:"P"},
    {q:"Which letter comes right after S?", options:["R","T","U","Q"], correct:"T"},
    {q:"Which letter comes right before B?", options:["A","C","Z","D"], correct:"A"},
    {q:"Which word comes FIRST in alphabetical order?", options:["Cat","Ant","Dog","Fish"], correct:"Ant"},
    {q:"Which word comes FIRST in alphabetical order?", options:["Dog","Ball","Egg","Hat"], correct:"Ball"},
    {q:"Which word comes FIRST in alphabetical order?", options:["Zebra","Apple","Monkey","King"], correct:"Apple"},
    {q:"Which word comes FIRST in alphabetical order: Ant, Goat, Zebra, Monkey?", options:["Goat","Zebra","Ant","Monkey"], correct:"Ant"},
    {q:"Which word comes FIRST in alphabetical order: January, April, October, May?", options:["January","October","May","April"], correct:"April"},
    {q:"Which word comes FIRST in alphabetical order: King, Queen, Servant, Maid?", options:["Queen","Servant","King","Maid"], correct:"King"},
    {q:"Which word comes FIRST in alphabetical order: Orange, Banana, Grapes, Apple?", options:["Orange","Grapes","Banana","Apple"], correct:"Apple"},
    {q:"Which word comes FIRST in alphabetical order: Dubai, India, China, England?", options:["Dubai","India","England","China"], correct:"China"},
    {q:"How many vowels are there in the English alphabet?", options:["5","6","21","26"], correct:"5"},
    {q:"How many consonants are there in the English alphabet?", options:["20","21","22","26"], correct:"21"},
    {q:"Which of these letters is a VOWEL?", options:["b","e","k","m"], correct:"e"},
    {q:"Which of these letters is a CONSONANT?", options:["a","i","k","o"], correct:"k"},
    {q:"Which letter is NOT a vowel?", options:["a","e","c","u"], correct:"c"},
    {q:"Which group shows all FIVE vowels?", options:["a, e, i, o, u","a, b, c, d, e","p, q, r, s, t","m, n, o, p, q"], correct:"a, e, i, o, u"},
    {q:"Is the letter 'U' a vowel or a consonant?", options:["Vowel","Consonant","Number","Neither"], correct:"Vowel"},
    {q:"Is the letter 'B' a vowel or a consonant?", options:["Consonant","Vowel","Number","Neither"], correct:"Consonant"},
    {q:"🐱 What is the first letter of CAT?", options:["C","A","T","D"], correct:"C"},
    {q:"🐟 What is the first letter of FISH?", options:["F","I","S","H"], correct:"F"},
    {q:"🪁 What is the first letter of KITE?", options:["K","I","T","E"], correct:"K"},
    {q:"🦓 What is the first letter of ZEBRA?", options:["Z","E","B","A"], correct:"Z"},
    {q:"🐱 Complete the word: C _ T (Cat). Which letter is missing?", options:["A","E","I","O"], correct:"A"},
    {q:"🐶 Complete the word: D _ G (Dog). Which letter is missing?", options:["O","A","I","U"], correct:"O"}
  ];

  const TOTAL = RAW_QUESTIONS.length;
  let questions = [];
  let userAnswers = [];

  function shuffleArray(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function buildQuestions(){
    questions = RAW_QUESTIONS.map(item => ({
      q: item.q,
      correct: item.correct,
      shuffledOptions: shuffleArray(item.options)
    }));
    userAnswers = new Array(TOTAL).fill(null);
  }

  const quizSection = document.getElementById('quizSection');
  const progressLabel = document.getElementById('progressLabel');
  const progressFill = document.getElementById('progressFill');
  const submitWrap = document.getElementById('submitWrap');
  const resultsSection = document.getElementById('resultsSection');
  const scoreBig = document.getElementById('scoreBig');
  const percentageText = document.getElementById('percentageText');
  const encourageText = document.getElementById('encourageText');
  const reviewList = document.getElementById('reviewList');

  function renderQuiz(){
    quizSection.innerHTML = '';
    questions.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'card-' + idx;

      const row = document.createElement('div');
      row.className = 'q-text-row';
      const numSpan = document.createElement('span');
      numSpan.className = 'q-number';
      numSpan.textContent = (idx+1);
      const qText = document.createElement('span');
      qText.className = 'q-text';
      qText.textContent = item.q;
      row.appendChild(numSpan);
      row.appendChild(qText);
      card.appendChild(row);

      const optsWrap = document.createElement('div');
      optsWrap.className = 'options';
      item.shuffledOptions.forEach(optText => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = optText;
        btn.addEventListener('click', () => selectAnswer(idx, optText, btn));
        optsWrap.appendChild(btn);
      });
      card.appendChild(optsWrap);
      quizSection.appendChild(card);
    });
  }

  function selectAnswer(qIdx, optText, btnEl){
    userAnswers[qIdx] = optText;
    const card = document.getElementById('card-' + qIdx);
    card.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
    updateProgress();
  }

  function updateProgress(){
    const answeredCount = userAnswers.filter(a => a !== null).length;
    progressLabel.textContent = answeredCount + ' of ' + TOTAL + ' answered';
    progressFill.style.width = ((answeredCount/TOTAL)*100) + '%';
  }

  function getEncouragement(pct){
    if(pct === 100) return "🌟 Perfect Score! You are an Alphabet Superstar! 🌟";
    if(pct >= 80) return "🏆 Wonderful job! You know your alphabet very well!";
    if(pct >= 60) return "😊 Good work! Keep practicing to become a superstar!";
    if(pct >= 40) return "💪 Nice try! A little more practice will help you shine!";
    return "🌈 Keep going! Practice makes perfect - try again!";
  }

  function submitQuiz(){
    let score = 0;
    questions.forEach((item, idx) => {
      if(userAnswers[idx] === item.correct) score++;
    });
    const pct = Math.round((score/TOTAL)*100);

    // lock all option buttons and show correct/wrong coloring
    questions.forEach((item, idx) => {
      const card = document.getElementById('card-' + idx);
      const buttons = card.querySelectorAll('.option-btn');
      buttons.forEach(b => {
        b.disabled = true;
        if(b.textContent === item.correct){
          b.classList.add('correct-answer');
        } else if(b.textContent === userAnswers[idx] && userAnswers[idx] !== item.correct){
          b.classList.add('wrong-answer');
        }
      });
    });

    scoreBig.textContent = score + ' / ' + TOTAL;
    percentageText.textContent = pct + '%';
    encourageText.textContent = getEncouragement(pct);

    reviewList.innerHTML = '';
    questions.forEach((item, idx) => {
      const ua = userAnswers[idx];
      const div = document.createElement('div');
      let statusIcon, lineHtml;
      if(ua === null){
        div.className = 'review-card unanswered';
        statusIcon = '➖';
        lineHtml = '<div class="review-line info-line">➖ Not answered</div>' +
                   '<div class="review-line correct-line">✅ Correct answer: ' + item.correct + '</div>';
      } else if(ua === item.correct){
        div.className = 'review-card';
        statusIcon = '✅';
        lineHtml = '<div class="review-line correct-line">✅ Your answer: ' + ua + ' (Correct!)</div>';
      } else {
        div.className = 'review-card wrong';
        statusIcon = '❌';
        lineHtml = '<div class="review-line wrong-line">❌ Your answer: ' + ua + '</div>' +
                   '<div class="review-line correct-line">✅ Correct answer: ' + item.correct + '</div>';
      }
      div.innerHTML = '<div class="review-q">' + statusIcon + ' Q' + (idx+1) + '. ' + item.q + '</div>' + lineHtml;
      reviewList.appendChild(div);
    });

    submitWrap.style.display = 'none';
    resultsSection.style.display = 'block';
    window.scrollTo({top: resultsSection.offsetTop - 20, behavior:'smooth'});
  }

  function resetQuiz(){
    buildQuestions();
    renderQuiz();
    updateProgress();
    submitWrap.style.display = 'block';
    resultsSection.style.display = 'none';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  document.getElementById('submitBtn').addEventListener('click', submitQuiz);
  document.getElementById('tryAgainBtn').addEventListener('click', resetQuiz);

  buildQuestions();
  renderQuiz();
  updateProgress();
})();
</script>

</body>
</html>
